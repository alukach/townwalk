<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Town Walk</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #a8d8ff; font: 13px/1.4 system-ui, sans-serif;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
    canvas { display: block; }
    .panel { position: fixed; padding: 8px 10px; border-radius: 8px; background: #fffd; color: #222; }
    #hud { left: 12px; top: 12px; white-space: pre; }
    #help { right: 12px; bottom: 12px; }
    #minimap { position: fixed; left: 16px; bottom: 16px; width: 220px; height: 220px; border-radius: 50%;
      border: 5px solid #23262e; box-shadow: 0 4px 14px #0006; background: #4fb3e8; }
    #mapbtn { position: fixed; left: 196px; bottom: 196px; width: 40px; height: 40px; border-radius: 50%; border: 3px solid #23262e;
      background: #ffd166; font: 800 15px system-ui; cursor: pointer; }
    #map { position: fixed; inset: 0; background: #23262ecc; display: grid; grid-template-rows: auto 1fr; }
    #map[hidden] { display: none; }
    #map header { color: #fff; padding: 10px 16px; font-weight: 600; }
    #bigmap { width: calc(100% - 32px); height: calc(100% - 16px); margin: 0 16px 16px; border: 5px solid #23262e;
      border-radius: 14px; box-sizing: border-box; cursor: grab; touch-action: none; }
    /* place search (top centre), floating POI labels, current street + area (top right), area title card */
    #searchbox { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); width: min(420px, 60vw); z-index: 5; }
    #search { width: 100%; box-sizing: border-box; padding: 9px 14px; border-radius: 22px; border: 3px solid #23262e;
      font: 600 14px system-ui, sans-serif; background: #fff; outline: none; }
    #results { list-style: none; margin: 6px 0 0; padding: 4px; border-radius: 12px; background: #fff; border: 3px solid #23262e; }
    #results[hidden] { display: none; }
    #results li { padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; }
    #results li:hover { background: #ffd16655; }
    #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .poi { position: absolute; left: 0; top: 0; white-space: nowrap; font: 700 15px system-ui, sans-serif; color: #23262e;
      background: #fffe; border: 2px solid #23262e; border-radius: 14px; padding: 2px 9px 2px 6px; transform-origin: 50% 100%; }
    .poi span { margin-left: 5px; }
    #where { position: fixed; right: 16px; top: 12px; text-align: right; color: #fff; text-shadow: 0 2px 0 #23262e, 0 0 6px #23262e;
      font: italic 800 22px system-ui, sans-serif; pointer-events: none; }
    #where span { display: block; font-size: 14px; font-weight: 700; opacity: 0.9; }
    #banner { position: fixed; left: 0; right: 0; top: 22%; text-align: center; color: #ffd166; pointer-events: none; opacity: 0;
      font: italic 900 clamp(28px, 6vw, 64px) system-ui, sans-serif; text-shadow: 0 4px 0 #23262e, 0 0 14px #23262e; }
    #banner.show { animation: banner 4s ease-out; }
    @keyframes banner { 0% { opacity: 0; transform: translateY(12px); } 12%, 70% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    /* touch: a stick bottom-right, the keyboard hint swapped out */
    #stick { position: fixed; right: max(20px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom));
      width: 140px; height: 140px; border-radius: 50%; background: #23262e55; border: 3px solid #23262ecc; display: none; }
    #stick > div { position: absolute; left: 35%; top: 35%; width: 30%; height: 30%; border-radius: 50%;
      background: #ffd166; border: 3px solid #23262e; pointer-events: none; }
    .touch { display: none; }
    @media (pointer: coarse) {
      #stick { display: block; }
      #help .keys { display: none; } #help .touch { display: inline; }
      #help { right: auto; left: 50%; transform: translateX(-50%); top: 12px; bottom: auto; }
    }
    @media (max-width: 700px) {
      #searchbox { top: 60px; width: calc(100% - 24px); }
      #where { top: 108px; font-size: 16px; } #where span { font-size: 12px; }
      #hud { font-size: 11px; padding: 6px 8px; }
      #help { font-size: 11px; white-space: nowrap; top: auto; bottom: 178px; }
      #minimap { width: 140px; height: 140px; left: 12px; bottom: max(12px, env(safe-area-inset-bottom)); border-width: 4px; }
      #mapbtn { left: 122px; bottom: 122px; width: 34px; height: 34px; }
      #bigmap { width: calc(100% - 16px); margin: 0 8px 8px; }
      #map header { font-size: 12px; padding: 8px 10px; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "pmtiles": "https://cdn.jsdelivr.net/npm/pmtiles@3.2.1/+esm",
        "@mapbox/vector-tile": "https://cdn.jsdelivr.net/npm/@mapbox/vector-tile@2.0.3/+esm",
        "pbf": "https://cdn.jsdelivr.net/npm/pbf@4.0.1/+esm"
      }
    }
  </script>
</head>
<body>
  <div id="labels"></div>
  <div id="hud" class="panel">loading…</div>
  <div id="searchbox"><input id="search" type="search" placeholder="Search a place, or lat, lon" autocomplete="off" spellcheck="false" /><ul id="results" hidden></ul></div>
  <div id="where"></div>
  <div id="banner"></div>
  <div id="help" class="panel"><span class="keys">WASD / arrows to walk · Shift to run · M for the map</span><span class="touch">Stick to walk (push to the rim to run) · tap M for the map</span></div>
  <div id="stick"><div></div></div>
  <canvas id="minimap"></canvas>
  <button id="mapbtn" title="Map (M)">M</button>
  <div id="map" hidden>
    <header>Drag to pan · scroll or pinch to zoom · double-click or double-tap to jump there · M or Esc to close</header>
    <canvas id="bigmap"></canvas>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
